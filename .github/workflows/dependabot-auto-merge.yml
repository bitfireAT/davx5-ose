name: Dependabot auto-merge
on: pull_request

# See https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions#enabling-automerge-on-a-pull-request
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-l10n:
    name: Auto-merge l10n updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'bitfireAT/davx5-ose'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # merges as soon as required checks ("Tests") pass
      - name: Approve and enable auto-merge
        if: steps.metadata.outputs.dependency-names == 'l10n'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
